name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, local]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to GCP VM
        run: |
          gcloud compute scp index.html exegetic-web:/tmp/index.html \
            --project=karmamudra-uk --zone=europe-west1-b --quiet
          gcloud compute ssh exegetic-web \
            --project=karmamudra-uk --zone=europe-west1-b --quiet \
            --command="sudo cp /tmp/index.html /var/www/html/index.html"
          echo "Deployed to exegetic.uk"

      - name: Sync to HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Older runs stored the token in an `hf` remote URL inside .git/config on the runner.
          git remote remove hf 2>/dev/null || true
          # Pass credentials for this push only, so the token is never written to disk.
          AUTH=$(printf 'overthelex:%s' "$HF_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$AUTH"
          git -c http.extraHeader="Authorization: Basic $AUTH" \
            push https://huggingface.co/spaces/Anamavajra-Labs/exegetic-uk HEAD:main --force

      - name: Health check
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://exegetic.uk/)
          echo "exegetic.uk: HTTP $STATUS"
          [ "$STATUS" = "200" ] || exit 1
