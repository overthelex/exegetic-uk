name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, local]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to GCP VM
        run: |
          gcloud compute scp index.html exegetic-web:/tmp/index.html \
            --project=karmamudra-uk --zone=europe-west1-b --quiet
          gcloud compute ssh exegetic-web \
            --project=karmamudra-uk --zone=europe-west1-b --quiet \
            --command="sudo cp /tmp/index.html /var/www/html/index.html"
          echo "Deployed to exegetic.uk"

      - name: Sync to HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote set-url hf https://overthelex:${HF_TOKEN}@huggingface.co/spaces/Anamavajra-Labs/exegetic-uk 2>/dev/null || \
            git remote add hf https://overthelex:${HF_TOKEN}@huggingface.co/spaces/Anamavajra-Labs/exegetic-uk
          git push hf main --force

      - name: Health check
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://exegetic.uk/)
          echo "exegetic.uk: HTTP $STATUS"
          [ "$STATUS" = "200" ] || exit 1
